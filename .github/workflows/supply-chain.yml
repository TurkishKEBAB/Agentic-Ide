name: Supply Chain Checks

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write
  id-token: write

jobs:
  npm-audit-and-sbom:
    name: npm audit and SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Detect npm lockfile
        id: npm
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            echo "has_lockfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_lockfile=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Planning-only repository notice
        if: steps.npm.outputs.has_lockfile == 'false'
        run: echo "No package-lock.json yet; npm audit and SBOM are armed and will run after app dependencies exist."

      - name: Setup Node
        if: steps.npm.outputs.has_lockfile == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        if: steps.npm.outputs.has_lockfile == 'true'
        run: npm ci

      - name: Audit high and critical vulnerabilities
        if: steps.npm.outputs.has_lockfile == 'true'
        run: npm audit --audit-level=high

      - name: Generate CycloneDX SBOM
        if: steps.npm.outputs.has_lockfile == 'true'
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - name: Upload SBOM artifact
        if: steps.npm.outputs.has_lockfile == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error

  openssf-scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@v2.4.3
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload Scorecard artifact
        uses: actions/upload-artifact@v7
        with:
          name: openssf-scorecard
          path: scorecard-results.sarif
          if-no-files-found: warn
