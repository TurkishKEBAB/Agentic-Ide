name: CodeQL Analysis

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "18 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Detect application scaffold
        id: app
        shell: bash
        run: |
          if [[ -f package.json ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Planning-only repository notice
        if: steps.app.outputs.exists == 'false'
        run: echo "No package.json yet; CodeQL is armed and will run after the first app scaffold."

      - name: Initialize CodeQL
        if: steps.app.outputs.exists == 'true'
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality

      - name: Autobuild
        if: steps.app.outputs.exists == 'true'
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        if: steps.app.outputs.exists == 'true'
        uses: github/codeql-action/analyze@v4
