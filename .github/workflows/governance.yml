name: Repository Governance

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-governance:
    name: Validate repository governance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate project metadata and seed data
        shell: pwsh
        run: ./scripts/validate-github-governance.ps1 -Owner TurkishKEBAB
